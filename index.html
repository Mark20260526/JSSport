<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>羽动 OA 系统 (云端版)</title>
    <style>
        :root{--primary:#2563eb;--success:#10b981;--warning:#f59e0b;--danger:#ef4444;--info:#0ea5e9;--purple:#8b5cf6;--sidebar-bg:#1e293b;--text-light:#f8fafc;--text-muted:#94a3b8;--border:#e2e8f0}
        *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,sans-serif}
        body{display:flex;min-height:100vh;background:#f1f5f9;color:#334155}
        .sidebar{width:240px;background:var(--sidebar-bg);color:var(--text-light);display:flex;flex-direction:column;position:fixed;height:100vh;z-index:10}
        .logo{padding:24px 20px;font-size:1.25rem;font-weight:bold;border-bottom:1px solid #334155;display:flex;justify-content:space-between;align-items:center}
        .reset-btn{font-size:.7rem;background:#334155;color:#94a3b8;border:none;padding:4px 8px;border-radius:4px;cursor:pointer}
        .reset-btn:hover{background:var(--danger);color:white}
        .menu{padding:16px 0;flex:1}
        .menu-item{padding:12px 20px;display:flex;align-items:center;gap:12px;color:var(--text-muted);cursor:pointer;transition:all .2s;user-select:none}
        .menu-item:hover{background:#334155;color:white}
        .menu-item.active{background:var(--primary);color:white}
        .main-content{flex:1;margin-left:240px;padding:24px}
        .header{background:white;padding:16px 24px;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.1);margin-bottom:24px;display:flex;justify-content:space-between;align-items:center}
        .page-title{font-size:1.25rem;font-weight:600}
        .page-content{display:none}.page-content.active{display:block}
        .stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px;margin-bottom:24px}
        .stat-card{background:white;padding:20px;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.1)}
        .stat-card h3{font-size:.875rem;color:#64748b;margin-bottom:8px}
        .stat-card p{font-size:1.5rem;font-weight:bold}
        .stat-card p.text-success{color:var(--success)}.stat-card p.text-danger{color:var(--danger)}
        .card{background:white;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.1);padding:20px}
        .card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:12px}
        .table-wrapper{overflow-x:auto;-webkit-overflow-scrolling:touch}
        table{width:100%;border-collapse:collapse;min-width:600px}
        th,td{padding:12px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap}
        th{background:#f8fafc;font-weight:600;font-size:.875rem;color:#64748b}
        .btn{padding:8px 16px;border:none;border-radius:6px;cursor:pointer;font-size:.875rem;transition:.2s}
        .btn-primary{background:var(--primary);color:white}.btn-primary:hover{background:#1d4ed8}
        .btn-success{background:var(--success);color:white}.btn-success:hover{background:#059669}
        .btn-danger{background:var(--danger);color:white}
        .btn-info{background:var(--info);color:white}.btn-info:hover{background:#0284c7}
        .btn-purple{background:var(--purple);color:white}.btn-purple:hover{background:#7c3aed}
        .btn-sm{padding:4px 10px;font-size:.75rem;margin-right:6px}
        .btn:disabled{opacity:.6;cursor:not-allowed}
        .empty-state{text-align:center;padding:40px 0;color:#94a3b8}
        .modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);display:flex;justify-content:center;align-items:center;z-index:1000;opacity:0;pointer-events:none;transition:opacity .3s}
        .modal.active{opacity:1;pointer-events:auto}
        .modal-content{background:white;padding:24px;border-radius:8px;width:90%;max-width:400px}
        .modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
        .form-group{margin-bottom:16px}
        .form-group label{display:block;margin-bottom:6px;font-size:.875rem;font-weight:500}
        .form-control{width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:6px;outline:none}
        .form-control:focus{border-color:var(--primary);box-shadow:0 0 0 2px rgba(37,99,235,.1)}
        .form-control:read-only{background:#f1f5f9;color:#64748b}
        .badge{padding:2px 8px;border-radius:12px;font-size:.75rem;font-weight:500}
        .badge-consume{background:#fee2e2;color:#991b1b}.badge-recharge{background:#dcfce7;color:#166534}
        #loadingOverlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(255,255,255,.85);display:none;flex-direction:column;justify-content:center;align-items:center;z-index:9999;font-size:1.1rem;color:#334155;backdrop-filter:blur(2px)}
        #loadingOverlay.active{display:flex}
        .spinner{border:4px solid #f3f3f3;border-top:4px solid var(--primary);border-radius:50%;width:40px;height:40px;animation:spin 1s linear infinite;margin-bottom:16px}
        @keyframes spin{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
    </style>
</head>
<body>
    <div id="loadingOverlay"><div class="spinner"></div><span id="loadingText">正在处理...</span></div>

    <aside class="sidebar">
        <div class="logo"><span>🏸 羽动 OA</span><button class="reset-btn" onclick="resetAllData()" title="清除云端所有数据">重置数据</button></div>
        <nav class="menu">
            <div class="menu-item active" data-page="dashboard">📊 仪表盘</div>
            <div class="menu-item" data-page="members">👥 会员管理</div>
            <div class="menu-item" data-page="transactions">💰 交易记录</div>
            <div class="menu-item" data-page="reports">📈 数据报表</div>
        </nav>
    </aside>

    <main class="main-content">
        <header class="header"><h1 class="page-title" id="pageTitle">仪表盘</h1><div>管理员：张三</div></header>

        <section id="dashboard" class="page-content active">
            <div class="stats-grid">
                <div class="stat-card"><h3>今日充值 (营收)</h3><p id="todayRevenue" class="text-success">¥ 0.00</p></div>
                <div class="stat-card"><h3>今日消费 (笔数)</h3><p id="todayOrders">0</p></div>
                <div class="stat-card"><h3>今日消费总额</h3><p id="todayConsumeAmount" class="text-danger">¥ 0.00</p></div>
                <div class="stat-card"><h3>总会员数</h3><p id="totalMembersStat">0</p></div>
            </div>
            <div class="card"><h3>系统公告</h3><p style="margin-top:12px; color:#64748b;">欢迎使用羽动OA系统。数据已全面接入 Bmob 云数据库，支持多端实时同步。</p></div>
        </section>

        <section id="members" class="page-content">
            <div class="card">
                <div class="card-header"><h2>会员列表</h2><button class="btn btn-primary" onclick="openModal('memberModal')">+ 添加新会员</button></div>
                <div class="table-wrapper">
                    <table><thead><tr><th>ID</th><th>姓名</th><th>电话</th><th>余额</th><th>操作</th></tr></thead><tbody id="membersTableBody"></tbody></table>
                </div>
            </div>
        </section>

        <section id="transactions" class="page-content">
            <div class="card">
                <div class="card-header"><h2 id="transPageTitle">交易流水明细</h2><button class="btn btn-primary" id="btnShowAllTrans" style="display: none;" onclick="showAllTransactions()">← 返回全部记录</button></div>
                <div class="table-wrapper">
                    <table><thead><tr><th>流水号</th><th>会员姓名</th><th>交易类型</th><th>交易金额</th><th>说明</th><th>交易时间</th></tr></thead><tbody id="transactionsTableBody"></tbody></table>
                </div>
            </div>
        </section>

        <section id="reports" class="page-content"><div class="card"><h2>数据报表</h2><p style="margin-top:20px; color:#64748b;">报表生成功能开发中。</p></div></section>
    </main>

    <div class="modal" id="memberModal">
        <div class="modal-content">
            <div class="modal-header"><h3>添加新会员</h3><span style="cursor:pointer; font-size:1.5rem; line-height:1;" onclick="closeModal('memberModal')">×</span></div>
            <div class="form-group"><label>姓名</label><input type="text" id="inputName" class="form-control" placeholder="请输入姓名"></div>
            <div class="form-group"><label>电话</label><input type="tel" id="inputPhone" class="form-control" placeholder="请输入电话"></div>
            <div class="form-group"><label>初始余额/充值 (元)</label><input type="number" id="inputBalance" class="form-control" placeholder="请输入余额" value="0" step="0.01" min="0"></div>
            <div style="text-align:right; margin-top:24px;">
                <button class="btn" onclick="closeModal('memberModal')" style="margin-right:10px; background:#f1f5f9;">取消</button>
                <button class="btn btn-primary" id="btnSaveMember" onclick="saveMember()">保存</button>
            </div>
        </div>
    </div>

    <div class="modal" id="transactionModal">
        <div class="modal-content">
            <div class="modal-header"><h3>录入消费记录</h3><span style="cursor:pointer; font-size:1.5rem; line-height:1;" onclick="closeModal('transactionModal')">×</span></div>
            <input type="hidden" id="transMemberId"><input type="hidden" id="transMemberObjId">
            <div class="form-group"><label>消费会员</label><input type="text" id="transMemberName" class="form-control" readonly></div>
            <div class="form-group"><label>消费日期</label><input type="date" id="transDate" class="form-control"></div>
            <div class="form-group"><label>消费金额 (元)</label><input type="number" id="transAmount" class="form-control" placeholder="请输入消费金额" step="0.01" min="0"></div>
            <div class="form-group"><label>消费说明</label><input type="text" id="transDesc" class="form-control" placeholder="例如：场地费、购买羽毛球等"></div>
            <div style="text-align:right; margin-top:24px;">
                <button class="btn" onclick="closeModal('transactionModal')" style="margin-right:10px; background:#f1f5f9;">取消</button>
                <button class="btn btn-success" id="btnSaveTrans" onclick="saveTransaction()">确认扣款</button>
            </div>
        </div>
    </div>

    <div class="modal" id="rechargeModal">
        <div class="modal-content">
            <div class="modal-header"><h3>会员充值</h3><span style="cursor:pointer; font-size:1.5rem; line-height:1;" onclick="closeModal('rechargeModal')">×</span></div>
            <input type="hidden" id="rechargeMemberId"><input type="hidden" id="rechargeMemberObjId">
            <div class="form-group"><label>充值会员</label><input type="text" id="rechargeMemberName" class="form-control" readonly></div>
            <div class="form-group"><label>充值金额 (元)</label><input type="number" id="rechargeAmount" class="form-control" placeholder="请输入充值金额" step="0.01" min="0"></div>
            <div class="form-group"><label>充值说明 (选填)</label><input type="text" id="rechargeDesc" class="form-control" placeholder="例如：微信收款、现金等"></div>
            <div style="text-align:right; margin-top:24px;">
                <button class="btn" onclick="closeModal('rechargeModal')" style="margin-right:10px; background:#f1f5f9;">取消</button>
                <button class="btn btn-purple" id="btnSaveRecharge" onclick="saveRecharge()">确认充值</button>
            </div>
        </div>
    </div>

    <script>
        // ================= Bmob 配置与核心请求 (代理优化版) =================
		const BMOB_CONFIG = {
			appId: '76ecad8d9123fe0d466cd4dc0ac6704e',
			restApiKey: '33886f07a54a3fa9dec600f0c13fceea',
			// 【核心修改】：使用 Bmob 提供的 Netlify 代理域名
			// 绕过 api.bmob.cn 的 DNS 解析失败问题，同时利用代理服务器处理 CORS 跨域
			baseUrl: 'https://jmsport2026.netlify.app/8/classes/' 
		};

		let membersCache = [];
		let currentFilterMemberId = null;

		/**
		 * 核心请求封装 (优化版：修复 HTTP 状态码处理、兼容代理网关)
		 * 接口签名保持不变，确保原有业务逻辑无需修改
		 */
		async function bmobRequest(endpoint, method = 'GET', body = null) {
			const url = new URL(`${BMOB_CONFIG.baseUrl}${endpoint}`);
			url.searchParams.append('t', Date.now()); // 追加时间戳防止缓存
			
			// 决定实际发出的 HTTP 方法（绕过部分网关/代理对 PUT/DELETE 的限制）
			const actualMethod = (method === 'PUT' || method === 'DELETE') ? 'POST' : method;
			
			const options = {
				method: actualMethod,
				headers: {
					'X-Bmob-Application-Id': BMOB_CONFIG.appId,
					'X-Bmob-REST-API-Key': BMOB_CONFIG.restApiKey,
					'Content-Type': 'application/json'
				}
			};

			// 添加 Method Override 头，告诉 Bmob 服务器真实的意图
			if (method === 'PUT' || method === 'DELETE') {
				options.headers['X-HTTP-Method-Override'] = method;
			}

			// 只有在有 body 且不是 DELETE 请求时才附带 body (避免代理网关联报)
			if (body && method !== 'DELETE') {
				options.body = JSON.stringify(body);
			}
			
			try {
				const res = await fetch(url, options);
				
				// 【修复 1】：处理非 2xx 的 HTTP 状态码 (fetch 默认不抛出 404/401/500 等错误)
				if (!res.ok) {
					let errMsg = `HTTP 错误 ${res.status}`;
					try {
						const errorData = await res.json();
						errMsg = errorData.error || errorData.msg || errMsg;
						console.error('Bmob 返回错误详情:', errorData);
					} catch (e) {
						errMsg = await res.text(); // 如果返回的不是 JSON
					}
					throw new Error(errMsg);
				}

				// 【修复 2】：处理 204 No Content (DELETE 删除成功时通常没有返回体)
				if (res.status === 204) {
					return { success: true, msg: '删除成功' }; 
				}

				const data = await res.json();
				
				// 【修复 3】：处理 Bmob 业务逻辑错误 (如 code: 101 对象不存在)
				if (data.code && data.code !== 0) {
					throw new Error(data.error || `Bmob 业务错误 (Code: ${data.code})`);
				}
				
				return data;
			} catch (err) {
				// 【修复 4】：精准区分网络/CORS 错误和 业务代码错误
				if (err instanceof TypeError && err.message.includes('Failed to fetch')) {
					console.error('网络/CORS 错误:', err);
					throw new Error('网络连接失败或跨域被拦截！请检查网络环境，或确认 Bmob 代理域名是否生效。');
				}
				console.error('Bmob Request Error:', err);
				throw err;
			}
		}
		// ====================================================================


        function showLoading(text = '正在处理...') {
            document.getElementById('loadingText').innerText = text;
            document.getElementById('loadingOverlay').classList.add('active');
        }
        function hideLoading() {
            document.getElementById('loadingOverlay').classList.remove('active');
        }

        function openModal(id) { document.getElementById(id).classList.add('active'); }
        function closeModal(id) { document.getElementById(id).classList.remove('active'); }

        // 侧边栏导航
        document.querySelectorAll('.menu-item').forEach(item => {
            item.addEventListener('click', () => {
                document.querySelectorAll('.menu-item').forEach(i => i.classList.remove('active'));
                item.classList.add('active');
                const page = item.dataset.page;
                document.querySelectorAll('.page-content').forEach(p => p.classList.remove('active'));
                document.getElementById(page).classList.add('active');
                document.getElementById('pageTitle').innerText = item.innerText.replace(/^[^\s]+\s/, '');
                if (page === 'dashboard') updateDashboard();
                if (page === 'members') loadMembers();
                if (page === 'transactions') { currentFilterMemberId = null; loadTransactions(); }
            });
        });

        // 加载会员
        async function loadMembers() {
            showLoading('加载会员列表...');
            try {
                const data = await bmobRequest('Members?order=-createdAt&limit=1000');
                membersCache = data.results || [];
                renderMembers();
            } catch (e) { alert('加载会员失败: ' + e.message); }
            finally { hideLoading(); }
        }

        function renderMembers() {
            const tbody = document.getElementById('membersTableBody');
            if (membersCache.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="empty-state">暂无会员数据</td></tr>';
                return;
            }
            tbody.innerHTML = membersCache.map(m => `
                <tr>
                    <td>${m.customId || m.objectId.slice(-6)}</td>
                    <td>${m.name}</td>
                    <td>${m.phone || '-'}</td>
                    <td>¥ ${(m.balance || 0).toFixed(2)}</td>
                    <td>
                        <button class="btn btn-info btn-sm" onclick="openTransModal('${m.objectId}', '${m.customId}', '${m.name}')">消费</button>
                        <button class="btn btn-purple btn-sm" onclick="openRechargeModal('${m.objectId}', '${m.customId}', '${m.name}')">充值</button>
                        <button class="btn btn-primary btn-sm" onclick="filterMemberTrans('${m.customId}', '${m.name}')">明细</button>
                        <button class="btn btn-danger btn-sm" onclick="deleteMember('${m.objectId}', '${m.name}')">删除</button>
                    </td>
                </tr>
            `).join('');
        }

        // 保存会员 (修复了之前的致命语法错误)
        async function saveMember() {
            const name = document.getElementById('inputName').value.trim();
            const phone = document.getElementById('inputPhone').value.trim();
            const balance = parseFloat(document.getElementById('inputBalance').value) || 0;
            if (!name) return alert('请输入姓名');

            showLoading('保存会员...');
            try {
                const maxIdRes = await bmobRequest('Members?order=-customId&limit=1');
                let newMemberId = 1;
                if (maxIdRes.results.length > 0 && maxIdRes.results[0].customId) {
                    newMemberId = parseInt(maxIdRes.results[0].customId) + 1;
                }
                const memberIdStr = String(newMemberId).padStart(4, '0');

                // 核心修复点：修正了 newMemberidot 拼写错误，并将分号改为逗号
                const memberPayload = { customId: memberIdStr, name, phone, balance };
                await bmobRequest('Members', 'POST', memberPayload);

                if (balance > 0) {
                    const transPayload = {
                        memberId: memberIdStr, memberName: name, type: 'recharge',
                        amount: balance, description: '开卡初始充值', date: new Date().toISOString().split('T')[0]
                    };
                    await bmobRequest('Transactions', 'POST', transPayload);
                }

                closeModal('memberModal');
                document.getElementById('inputName').value = '';
                document.getElementById('inputPhone').value = '';
                document.getElementById('inputBalance').value = '0';
                await loadMembers();
                alert('会员添加成功！');
            } catch (e) { alert('保存失败: ' + e.message); }
            finally { hideLoading(); }
        }

        async function deleteMember(objId, name) {
            if (!confirm(`确定要删除会员 ${name} 吗？相关交易记录将保留。`)) return;
            showLoading('删除会员...');
            try {
                await bmobRequest(`Members/${objId}`, 'DELETE');
                await loadMembers();
            } catch (e) { alert('删除失败: ' + e.message); }
            finally { hideLoading(); }
        }

        // 交易相关
        function openTransModal(objId, customId, name) {
            document.getElementById('transMemberObjId').value = objId;
            document.getElementById('transMemberId').value = customId;
            document.getElementById('transMemberName').value = name;
            document.getElementById('transDate').value = new Date().toISOString().split('T')[0];
            document.getElementById('transAmount').value = '';
            document.getElementById('transDesc').value = '';
            openModal('transactionModal');
        }

        async function saveTransaction() {
            const objId = document.getElementById('transMemberObjId').value;
            const customId = document.getElementById('transMemberId').value;
            const name = document.getElementById('transMemberName').value;
            const date = document.getElementById('transDate').value;
            const amount = parseFloat(document.getElementById('transAmount').value);
            const desc = document.getElementById('transDesc').value.trim() || '日常消费';

            if (!date || !amount || amount <= 0) return alert('请填写正确的日期和金额');
            const member = membersCache.find(m => m.objectId === objId);
            if (!member) return alert('找不到该会员');
            if (member.balance < amount) return alert('余额不足！当前余额: ¥' + member.balance.toFixed(2));

            showLoading('处理消费...');
            try {
                await bmobRequest(`Members/${objId}`, 'PUT', { balance: { "__op": "Increment", "amount": -amount } });
                await bmobRequest('Transactions', 'POST', {
                    memberId: customId, memberName: name, type: 'consume', amount, description: desc, date
                });
                closeModal('transactionModal');
                await loadMembers();
                alert('消费录入成功！');
            } catch (e) { alert('消费录入失败: ' + e.message); }
            finally { hideLoading(); }
        }

        function openRechargeModal(objId, customId, name) {
            document.getElementById('rechargeMemberObjId').value = objId;
            document.getElementById('rechargeMemberId').value = customId;
            document.getElementById('rechargeMemberName').value = name;
            document.getElementById('rechargeAmount').value = '';
            document.getElementById('rechargeDesc').value = '';
            openModal('rechargeModal');
        }

        async function saveRecharge() {
            const objId = document.getElementById('rechargeMemberObjId').value;
            const customId = document.getElementById('rechargeMemberId').value;
            const name = document.getElementById('rechargeMemberName').value;
            const amount = parseFloat(document.getElementById('rechargeAmount').value);
            const desc = document.getElementById('rechargeDesc').value.trim() || '会员充值';

            if (!amount || amount <= 0) return alert('请填写正确的充值金额');

            showLoading('处理充值...');
            try {
                await bmobRequest(`Members/${objId}`, 'PUT', { balance: { "__op": "Increment", "amount": amount } });
                await bmobRequest('Transactions', 'POST', {
                    memberId: customId, memberName: name, type: 'recharge', amount, description: desc, date: new Date().toISOString().split('T')[0]
                });
                closeModal('rechargeModal');
                await loadMembers();
                alert('充值成功！');
            } catch (e) { alert('充值失败: ' + e.message); }
            finally { hideLoading(); }
        }

        // 交易记录查询
        async function loadTransactions() {
            showLoading('加载交易记录...');
            try {
                let query = 'Transactions?order=-createdAt&limit=200';
                if (currentFilterMemberId) query += `&where={"memberId":"${currentFilterMemberId}"}`;
                
                const data = await bmobRequest(query);
                renderTransactions(data.results || []);
            } catch (e) { alert('加载交易记录失败: ' + e.message); }
            finally { hideLoading(); }
        }

        function renderTransactions(list) {
            const tbody = document.getElementById('transactionsTableBody');
            if (list.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="empty-state">暂无交易记录</td></tr>';
                return;
            }
            tbody.innerHTML = list.map(t => `
                <tr>
                    <td>${t.objectId.slice(-8)}</td>
                    <td>${t.memberName}</td>
                    <td><span class="badge ${t.type === 'consume' ? 'badge-consume' : 'badge-recharge'}">${t.type === 'consume' ? '消费' : '充值'}</span></td>
                    <td style="color: ${t.type === 'consume' ? 'var(--danger)' : 'var(--success)'}; font-weight:bold;">
                        ${t.type === 'consume' ? '-' : '+'} ¥ ${(t.amount || 0).toFixed(2)}
                    </td>
                    <td>${t.description || '-'}</td>
                    <td>${t.date || new Date(t.createdAt).toLocaleDateString()}</td>
                </tr>
            `).join('');
        }

        function filterMemberTrans(customId, name) {
            currentFilterMemberId = customId;
            document.getElementById('transPageTitle').innerText = `${name} 的交易明细`;
            document.getElementById('btnShowAllTrans').style.display = 'inline-block';
            document.querySelectorAll('.menu-item').forEach(i => i.classList.remove('active'));
            document.querySelector('[data-page="transactions"]').classList.add('active');
            document.querySelectorAll('.page-content').forEach(p => p.classList.remove('active'));
            document.getElementById('transactions').classList.add('active');
            document.getElementById('pageTitle').innerText = '交易记录';
            loadTransactions();
        }

        function showAllTransactions() {
            currentFilterMemberId = null;
            document.getElementById('transPageTitle').innerText = '交易流水明细';
            document.getElementById('btnShowAllTrans').style.display = 'none';
            loadTransactions();
        }

        // 仪表盘
        async function updateDashboard() {
            showLoading('更新仪表盘...');
            try {
                const today = new Date().toISOString().split('T')[0];
                const [membersData, transData] = await Promise.all([
                    bmobRequest('Members?limit=1000'),
                    bmobRequest(`Transactions?where={"date":"${today}"}&limit=1000`)
                ]);
                
                document.getElementById('totalMembersStat').innerText = membersData.results.length;
                
                let todayRev = 0, todayCons = 0, todayOrders = 0;
                transData.results.forEach(t => {
                    if (t.type === 'recharge') todayRev += t.amount || 0;
                    if (t.type === 'consume') { todayCons += t.amount || 0; todayOrders++; }
                });
                
                document.getElementById('todayRevenue').innerText = `¥ ${todayRev.toFixed(2)}`;
                document.getElementById('todayConsumeAmount').innerText = `¥ ${todayCons.toFixed(2)}`;
                document.getElementById('todayOrders').innerText = todayOrders;
            } catch (e) { console.error(e); }
            finally { hideLoading(); }
        }

        async function resetAllData() {
            if (!confirm('⚠️ 危险操作：确定要清空云端所有会员和交易数据吗？此操作不可恢复！')) return;
            showLoading('正在清空数据...');
            try {
                const [m, t] = await Promise.all([bmobRequest('Members?limit=1000'), bmobRequest('Transactions?limit=1000')]);
                const delPromises = [];
                m.results.forEach(i => delPromises.push(bmobRequest(`Members/${i.objectId}`, 'DELETE')));
                t.results.forEach(i => delPromises.push(bmobRequest(`Transactions/${i.objectId}`, 'DELETE')));
                await Promise.all(delPromises);
                alert('数据已清空！');
                updateDashboard();
            } catch (e) { alert('重置失败: ' + e.message); }
            finally { hideLoading(); }
        }

        // 初始化
        window.onload = () => { updateDashboard(); };
    </script>
</body>
</html>
